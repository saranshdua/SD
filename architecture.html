<meta charset="UTF-8">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
    background: #0F1117; color: #D0D0D0; line-height: 1.5;
    padding: 0; margin: 0;
  }

  .header {
    background: linear-gradient(135deg, #1ABC9C 0%, #0EBD8F 100%);
    padding: 36px 40px 28px; color: white;
  }
  .header h1 { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
  .header p { font-size: 15px; opacity: 0.85; }
  .header-stats { display: flex; gap: 24px; margin-top: 16px; flex-wrap: wrap; }
  .header-stat {
    background: rgba(255,255,255,0.15); border-radius: 8px; padding: 8px 16px;
  }
  .header-stat strong { font-size: 20px; display: block; }
  .header-stat span { font-size: 11px; opacity: 0.8; }

  .controls {
    background: #151620; border-bottom: 1px solid #1E2030;
    padding: 10px 40px; display: flex; gap: 8px; align-items: center;
    position: sticky; top: 0; z-index: 50;
  }
  .ctrl-btn {
    background: #1E2030; border: 1px solid #2A2D3E; color: #AAA;
    border-radius: 6px; padding: 5px 14px; font-size: 12px; cursor: pointer;
    font-weight: 500; transition: all 0.15s;
  }
  .ctrl-btn:hover { background: #2A2D3E; color: #FFF; }

  .content { padding: 24px 40px 60px; max-width: 1100px; margin: 0 auto; }

  /* --- Table --- */
  table { width: 100%; border-collapse: collapse; }

  .row {
    border-bottom: 1px solid #1A1C28;
    transition: background 0.15s;
  }
  .row:hover { background: rgba(26,188,156,0.04); }

  .row td { padding: 0; vertical-align: middle; }

  .row-main {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0; cursor: pointer; user-select: none;
  }

  .indent { flex-shrink: 0; }

  .toggle {
    width: 20px; height: 20px; border-radius: 5px; border: none;
    background: #1E2030; color: #666; font-size: 10px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.15s; flex-shrink: 0;
  }
  .toggle:hover { background: #2A2D3E; color: #1ABC9C; }
  .toggle.expanded { color: #1ABC9C; transform: rotate(90deg); }
  .toggle.hidden { visibility: hidden; }

  .color-dot {
    width: 8px; height: 8px; border-radius: 3px; flex-shrink: 0;
  }

  .node-name {
    font-size: 14px; font-weight: 600; color: #E0E0E0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .node-meta {
    font-size: 12px; color: #666; margin-left: 8px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex-shrink: 1; min-width: 0;
  }

  .badge {
    font-size: 9px; padding: 2px 7px; border-radius: 4px;
    font-weight: 700; flex-shrink: 0; text-transform: uppercase;
  }
  .badge-keystone { background: #E74C3C; color: #FFF; }
  .badge-free { background: #27AE60; color: #FFF; }
  .badge-premium { background: #8E44AD; color: #FFF; }

  .row-detail {
    overflow: hidden; max-height: 0; opacity: 0;
    transition: max-height 0.3s ease, opacity 0.2s ease, padding 0.3s ease;
    padding: 0 0 0 0;
  }
  .row-detail.open {
    max-height: 500px; opacity: 1; padding: 0 0 12px 0;
  }
  .detail-content {
    margin-left: 58px; padding: 10px 16px;
    background: #151620; border-radius: 8px; border: 1px solid #1E2030;
    font-size: 13px; color: #AAA; line-height: 1.6; max-width: 700px;
  }

  /* Depth-based styling */
  .depth-0 .node-name { font-size: 16px; color: #1ABC9C; font-weight: 700; }
  .depth-1 .node-name { font-size: 15px; color: #E0E0E0; }
  .depth-2 .node-name { font-size: 14px; color: #CCC; }
  .depth-3 .node-name { font-size: 13px; color: #BBB; }
  .depth-4 .node-name { font-size: 13px; color: #AAA; }
  .depth-5 .node-name { font-size: 12px; color: #999; }

  /* Search */
  .search-wrap {
    flex: 1; max-width: 300px; position: relative;
  }
  .search-input {
    width: 100%; background: #1E2030; border: 1px solid #2A2D3E;
    border-radius: 6px; padding: 5px 12px 5px 30px; font-size: 12px;
    color: #CCC; outline: none;
  }
  .search-input:focus { border-color: #1ABC9C; }
  .search-icon {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    color: #555; font-size: 12px; pointer-events: none;
  }

  .highlight { background: rgba(26,188,156,0.25); border-radius: 2px; padding: 0 2px; }
  .row.search-hidden { display: none; }
</style>

// ============================================================
// RENDER TABLE
// ============================================================
const tbody = document.getElementById('tbody');
let allRows = [];

function renderNode(node, depth, parentPath) {
  const path = parentPath + '/' + node.n;
  const hasChildren = node.ch && node.ch.length > 0;
  const isLeaf = !hasChildren;
  const startExpanded = depth < 2;

  const tr = document.createElement('tr');
  tr.className = `row depth-${Math.min(depth, 5)}`;
  tr.dataset.path = path;
  tr.dataset.depth = depth;
  tr.dataset.name = node.n.toLowerCase();
  tr.dataset.meta = (node.m || '').toLowerCase();
  tr.dataset.text = (node.t || '').toLowerCase();

  // Main cell
  const td = document.createElement('td');
  td.colSpan = 1;

  const main = document.createElement('div');
  main.className = 'row-main';

  // Indent
  const indent = document.createElement('span');
  indent.className = 'indent';
  indent.style.width = (depth * 24) + 'px';
  main.appendChild(indent);

  // Toggle
  const toggle = document.createElement('button');
  toggle.className = `toggle ${hasChildren ? (startExpanded ? 'expanded' : '') : 'hidden'}`;
  toggle.innerHTML = '\u25B6';
  toggle.onclick = (e) => { e.stopPropagation(); toggleRow(tr); };
  main.appendChild(toggle);

  // Color dot
  const dot = document.createElement('span');
  dot.className = 'color-dot';
  dot.style.background = node.c;
  main.appendChild(dot);

  // Name
  const name = document.createElement('span');
  name.className = 'node-name';
  name.textContent = node.n;
  main.appendChild(name);

  // Badge
  if (node.badge) {
    const badge = document.createElement('span');
    badge.className = `badge badge-${node.badge}`;
    badge.textContent = node.badge;
    main.appendChild(badge);
  }

  // Meta
  if (node.m) {
    const meta = document.createElement('span');
    meta.className = 'node-meta';
    meta.textContent = node.m;
    main.appendChild(meta);
  }

  td.appendChild(main);

  // Detail row (tooltip content)
  if (node.t) {
    const detail = document.createElement('div');
    detail.className = 'row-detail';
    const content = document.createElement('div');
    content.className = 'detail-content';
    content.textContent = node.t;
    content.style.marginLeft = ((depth * 24) + 34) + 'px';
    detail.appendChild(content);
    td.appendChild(detail);

    main.addEventListener('click', () => {
      const isOpen = detail.classList.contains('open');
      // Close all other details
      document.querySelectorAll('.row-detail.open').forEach(d => {
        if (d !== detail) d.classList.remove('open');
      });
      detail.classList.toggle('open');
    });
  }

  tr.appendChild(td);
  tbody.appendChild(tr);

  const rowData = { tr, node, depth, path, hasChildren, expanded: startExpanded };
  allRows.push(rowData);

  // Children
  if (hasChildren) {
    node.ch.forEach(child => renderNode(child, depth + 1, path));
  }

  return rowData;
}

renderNode(TREE, 0, '');

// Initial visibility
updateVisibility();

function updateVisibility() {
  const expandedPaths = new Set();
  expandedPaths.add(''); // root always visible

  allRows.forEach(r => {
    if (r.expanded && r.hasChildren) {
      expandedPaths.add(r.path);
    }
  });

  allRows.forEach(r => {
    const parentPath = r.path.substring(0, r.path.lastIndexOf('/'));
    const visible = parentPath === '' || expandedPaths.has(parentPath);

    // Check all ancestors
    let anc = parentPath;
    let allVisible = true;
    while (anc.length > 0) {
      const ancRow = allRows.find(x => x.path === anc);
      if (ancRow && !ancRow.expanded) { allVisible = false; break; }
      anc = anc.substring(0, anc.lastIndexOf('/'));
    }

    r.tr.style.display = (r.depth === 0 || allVisible) ? '' : 'none';
  });
}

function toggleRow(tr) {
  const row = allRows.find(r => r.tr === tr);
  if (!row || !row.hasChildren) return;
  row.expanded = !row.expanded;
  const toggle = tr.querySelector('.toggle');
  toggle.classList.toggle('expanded', row.expanded);
  updateVisibility();
}

function expandAll() {
  allRows.forEach(r => { if (r.hasChildren) r.expanded = true; });
  document.querySelectorAll('.toggle:not(.hidden)').forEach(t => t.classList.add('expanded'));
  updateVisibility();
}

function collapseAll() {
  allRows.forEach(r => { if (r.hasChildren && r.depth > 0) r.expanded = false; });
  document.querySelectorAll('.toggle:not(.hidden)').forEach(t => {
    if (t.closest('.depth-0')) return;
    t.classList.remove('expanded');
  });
  allRows[0].expanded = true;
  updateVisibility();
}

function expandToDepth(d) {
  allRows.forEach(r => {
    if (r.hasChildren) r.expanded = r.depth < d;
  });
  document.querySelectorAll('.toggle:not(.hidden)').forEach(t => {
    const row = allRows.find(r => r.tr === t.closest('.row'));
    t.classList.toggle('expanded', row && row.expanded);
  });
  updateVisibility();
}

// ============================================================
// SEARCH
// ============================================================
const searchInput = document.getElementById('search');
searchInput.addEventListener('input', () => {
  const q = searchInput.value.toLowerCase().trim();

  if (!q) {
    // Reset
    allRows.forEach(r => {
      r.tr.classList.remove('search-hidden');
      r.tr.querySelector('.node-name').innerHTML = r.node.n;
    });
    updateVisibility();
    return;
  }

  // Find matching rows
  const matchSet = new Set();
  allRows.forEach(r => {
    if (r.tr.dataset.name.includes(q) || r.tr.dataset.meta.includes(q) || r.tr.dataset.text.includes(q)) {
      matchSet.add(r.path);
      // Add all ancestors
      let anc = r.path;
      while (anc.length > 0) {
        matchSet.add(anc);
        anc = anc.substring(0, anc.lastIndexOf('/'));
      }
    }
  });

  allRows.forEach(r => {
    const isMatch = matchSet.has(r.path);
    r.tr.style.display = isMatch ? '' : 'none';
    r.tr.classList.toggle('search-hidden', !isMatch);

    // Expand parents of matches
    if (isMatch && r.hasChildren) {
      r.expanded = true;
      const toggle = r.tr.querySelector('.toggle');
      if (toggle) toggle.classList.add('expanded');
    }

    // Highlight matching text in name
    const nameEl = r.tr.querySelector('.node-name');
    const original = r.node.n;
    if (original.toLowerCase().includes(q)) {
      const idx = original.toLowerCase().indexOf(q);
      nameEl.innerHTML = original.slice(0, idx) + '<span class="highlight">' + original.slice(idx, idx + q.length) + '</span>' + original.slice(idx + q.length);
    } else {
      nameEl.innerHTML = original;
    }
  });
});

// Keyboard: Escape clears search
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    searchInput.value = '';
    searchInput.dispatchEvent(new Event('input'));
  }
});
